[tool.pyright]
include = ["**/*.py"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".git"
]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.8"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
stubPath = "typings"

[tool.pyright.executionEnvironments]
root = "."
pythonVersion = "3.8"
extraPaths = ["."]
